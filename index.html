<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Stack Developer Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>FSWD</h1>
        <ul>
            <li>Home</li>
            <li>Course</li>
            <li>Register</li>
        </ul>
    </nav>

    <section class="hero">
        <h2>Become a Full Stack Developer</h2>
        <p>Learn frontend and backend development from scratch</p>
        <button>Get Started</button>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Frontend</h3>
            <p>HTML, CSS, JavaScript, React</p>
        </div>

        <div class="card">
            <h3>Backend</h3>
            <p>Node.js, Express, MongoDB</p>
        </div>

        <div class="card">
            <h3>Career</h3>
            <p>Projects, Internship & Job Support</p>
        </div>
    </section>

    <section class="form-section">
        <h2>Join the Course</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email Address" required>
            <select required>
                <option value="">Select Track</option>
                <option>Frontend</option>
                <option>Backend</option>
                <option>Full Stack</option>
            </select>
            <button type="submit">Enroll Now</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Full Stack Developer Program</p>
    </footer>

</body>
</html>
